<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  .pref-grid {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 10px 12px;
    align-items: center;
  }

  .pref-note {
    grid-column: 2;
    margin-top: -6px;
  }

  input[type="text"],
  input[type="number"] {
    width: 100%;
  }
</style>
</head>
<body>
  <div class="pref-section">
    <h3>Metadata</h3>
    <div class="pref-grid">
      <label for="language">Language</label>
      <input id="language" type="text" data-pref-key="metadata_language" placeholder="en-US" />
      <div></div>
      <p class="small secondary pref-help pref-note">
        Language code, e.g. <code>en-US</code>.
      </p>

      <label for="tmdb-auth">TMDB token override</label>
      <input id="tmdb-auth" type="text" data-pref-key="tmdb_auth" placeholder="Optional override" />
      <div></div>
      <p class="small secondary pref-help pref-note">
        Leave blank to use the bundled token.
      </p>
    </div>
  </div>

  <div class="pref-section">
    <h3>Overlay</h3>
    <div class="pref-grid">
      <label>
        <input type="checkbox" data-type="bool" data-pref-key="overlay_enabled" />
        Enable pause overlay
      </label>
      <div></div>

      <label>
        <input type="checkbox" data-type="bool" data-pref-key="overlay_fullscreen_only" />
        Show only in fullscreen
      </label>
      <div></div>
      <div></div>
      <p class="small secondary pref-help pref-note">
        Avoids windowed-mode drag-and-drop issues.
      </p>

      <label for="pause-delay">Pause delay (seconds)</label>
      <input id="pause-delay" type="number" min="0" step="0.1" data-type="float" data-pref-key="pause_delay_seconds" />

      <label for="synopsis-lines">Synopsis lines</label>
      <input id="synopsis-lines" type="number" min="2" max="8" step="1" data-type="int" data-pref-key="synopsis_lines" />

      <label>
        <input type="checkbox" data-type="bool" data-pref-key="debug_osd" />
        Show debug messages
      </label>
      <div></div>
    </div>
  </div>
</body>
</html>
